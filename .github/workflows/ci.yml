name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run when a newer commit is pushed to the same branch / PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Backend integration tests (TC-01 to TC-07, TC-10) need a real PostgreSQL database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: student_record_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Read by backend/src/config (NODE_ENV=test is set by the backend "test" script).
      # The test setup creates this database if needed and applies backend/db/schema.sql.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/student_record_system_test
      SESSION_SECRET: ci-only-session-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Check Node.js
        run: |
          node --version
          npm --version

      # ---- Backend: Controller/API, Service and Data Access layers ----
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests (unit + integration)
        working-directory: backend
        run: npm test -- --ci

      # ---- Frontend: Presentation/UI layer ----
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
