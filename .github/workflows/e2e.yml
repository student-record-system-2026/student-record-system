name: E2E (Chromium + Firefox)

# Browser system tests against the real running application (Test Plan 4.1 System Testing).
# Runs the full UI walkthrough (e2e/system.test.js) and the TC-09 browser-compatibility checks
# (e2e/portability.test.js) in Chromium and in Firefox - NFR-6, GitHub #29.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: student_record_system
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/student_record_system
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/student_record_system_test
      SESSION_SECRET: ci-only-session-secret
      PORT: 4000
      E2E_BASE_URL: http://localhost:4000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix e2e

      - name: Create database, apply schema and seed the TC-08 dataset
        run: npm --prefix backend run db:setup

      # The backend serves the production build of the UI on :4000 (single-server option).
      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Start application
        run: |
          nohup npm --prefix backend start > backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/api/health && exit 0
            sleep 1
          done
          echo "::error::Backend did not start"; cat backend.log; exit 1

      - name: Install ${{ matrix.browser }}
        working-directory: e2e
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: UI walkthrough (TC-01, TC-02, TC-05, TC-06, TC-07, NFR-4, NFR-8)
        working-directory: e2e
        env:
          BROWSER: ${{ matrix.browser }}
        run: node system.test.js

      - name: Re-seed demo data
        run: npm --prefix backend run db:seed

      - name: Browser compatibility checks (TC-09 steps 4-5, NFR-6)
        working-directory: e2e
        env:
          BROWSERS: ${{ matrix.browser }}
        run: node portability.test.js

      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.browser }}
          path: |
            e2e/shots/
            docs/Sprint2/TC-09_Browser_Results.md
            backend.log
          if-no-files-found: ignore
